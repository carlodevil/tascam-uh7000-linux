name: Build Debian package

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    permissions:
      contents: write
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates dpkg-dev lintian python3 shellcheck
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Shellcheck scripts
        run: shellcheck completions/uh7000ctl src/uh7000ctl src/tascam-uh7000-configure scripts/build-deb.sh scripts/ci-smoke.sh packaging/postinst packaging/postrm
      - name: Smoke test package and tools
        run: scripts/ci-smoke.sh
      - name: Build package
        run: |
          scripts/build-deb.sh
          sha256sum dist/*.deb > dist/SHA256SUMS
      - name: Inspect package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          lintian --tag-display-limit 0 dist/*.deb
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tascam-uh7000-linux-deb
          path: |
            dist/*.deb
            dist/SHA256SUMS
      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/SHA256SUMS
