[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tascam-uh7000-linux"
version = "0.2.0b14"
description = "Unofficial Linux control service and UAC2 integration for the TASCAM UH-7000"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "carlodevil", email = "64757000+carlodevil@users.noreply.github.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = ["pyusb>=1.2", "dbus-next>=0.2.3"]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
test = ["pytest>=8"]

[project.scripts]
uh7000ctl = "uh7000.cli:main"
uh7000d = "uh7000.service:main"
uh7000-panel = "uh7000.panel:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uh7000 = ["qml/*.qml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
extend-per-file-ignores = { "src/uh7000/service.py" = ["F722", "F821"] }
