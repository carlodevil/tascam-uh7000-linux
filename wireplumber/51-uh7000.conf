monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*UH7000.*" }
      { device.product.id = "0x8048" }
      { device.vendor.id = "0x0644" }
    ]
    actions = {
      update-props = {
        device.description = "TASCAM UH-7000"
        device.nick = "UH-7000"
        api.alsa.use-acp = true
        api.acp.auto-profile = false
        api.acp.auto-port = false
      }
    }
  }
]
