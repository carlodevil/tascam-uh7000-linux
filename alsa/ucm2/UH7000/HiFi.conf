SectionVerb {
    EnableSequence []
    DisableSequence []

    Value {
        TQ "HiFi"
    }
}

SectionDevice."Multitrack" {
    Comment "Four-channel playback"
    Value {
        PlaybackPCM "hw:${CardId},0"
        PlaybackChannels 4
        PlaybackPriority 200
    }
}

SectionDevice."Capture" {
    Comment "Six-channel capture; lanes 5/6 remain unverified"
    Value {
        CapturePCM "hw:${CardId},0"
        CaptureChannels 6
        CapturePriority 200
    }
}
